name: haftalik-bulten
# NOT: name = dosya adi (benzersiz). Eski 'Haftalik Bulten' adi bulten.yml ile
# CAKISIYORDU; bulten.yml silindi, isim dosya adina sabitlendi ki tekrar olmasin.
# haftalik-bulten Edge Function'ini tetikler (aboneler'e haftalik ozet e-postasi).
# Fonksiyon paylasilan gizli baslikla korunuyor: x-cron-secret == CRON_SECRET.
# Verisi (RPC'ler + bulten_aboneler) gunluk "Veri Guncelle" kosusundan sonra
# taze. Cuma 15:00 UTC (18:00 TR) -- hafta sonu alisverisinden once (eski
# bulten.yml'in niyeti). Elle de tetiklenebilir (workflow_dispatch).
on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Haftalik bulteni gonder
        run: |
          KOD=$(curl -s -o /tmp/yanit.txt -w "%{http_code}" -X POST \
            "https://gbgxxahhbfnulmyecxia.supabase.co/functions/v1/haftalik-bulten" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP=$KOD"
          echo "yanit: $(cat /tmp/yanit.txt)"
          if [ "$KOD" != "200" ]; then
            echo "::error::haftalik-bulten HTTP $KOD dondu (200 bekleniyordu) - e-posta gonderilmemis olabilir"
            exit 1
          fi
