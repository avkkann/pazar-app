name: perm-probe
# GECICI DOGRULAMA WORKFLOW'U. Amac: acik "permissions: contents: write" blogunun,
# depo VARSAYILANI READ iken bile GITHUB_TOKEN'a push yetkisi verdigini CANLI
# kanitlamak (il-marketler bugun veri degismedigi icin commit atmadi -> push'a
# ulasmadi -> kanit veremedi). Bu probe throwaway bir dala BOS commit push eder;
# main kirlenmez. Kanit alininca bu dosya SILINECEK ve dal silinecek.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bos commit push (write yetkisi testi)
        run: |
          git config user.name "perm-probe"
          git config user.email "probe@users.noreply.github.com"
          git commit --allow-empty -m "perm-probe: explicit contents:write under default=read"
          git push origin HEAD:refs/heads/perm-probe-check
          echo "PUSH OK -> acik contents:write, varsayilan read iken de push edebiliyor"
