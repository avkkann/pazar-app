# Il -> market zinciri haritasi. GUNLUK DEGIL HAFTALIK:
# zincir agi her gun degismiyor, gecelik "Veri Guncelle" kosusunu uzatmasin.
# 81 istek x 4,5 sn ~ 7 dakika.
name: Il Market Haritasi
on:
  schedule:
    # Pazar 04:30 UTC — gecelik veri kosusu (03:00, ~2 saat) bittikten sonra
    - cron: '30 4 * * 0'
  workflow_dispatch:

# GITHUB_TOKEN en az yetki: data/il_marketler.json COMMIT+PUSH ediyor
# -> contents: write sart. Acik blok depo varsayilanini (read) ezer.
permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python il_market_tara.py
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/il_marketler.json
          git commit -m "Il market haritasi guncellendi" || exit 0
          git pull --rebase origin main
          git push
