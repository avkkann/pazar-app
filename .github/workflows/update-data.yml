name: Veri Guncelle
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v3
        with:
          # Veri Tazelik Kontrolu adimi dosya basina 'git log' okuyor; shallow
          # clone'da HEAD'de degismeyen dosyalarin gecmisi gorunmez.
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
        env:
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
      - run: python hal_scraper.py
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Veri guncellendi" || exit 0
          git pull --rebase origin main
          git push
      - name: DB Senkronizasyonu
        run: python sync_db.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Sahte Indirim Analizi
        continue-on-error: true
        run: python indirim_analiz.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fiyat Alarmi Taramasi
        run: |
          curl -sf -X POST "https://gbgxxahhbfnulmyecxia.supabase.co/functions/v1/fiyat-alarm-scan" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"

      # Ana sayfanin dort seridi. "Sahte Indirim Analizi"nden SONRA kosmali:
      # supheli serit indirim_supheli_* kolonlarini okuyor.
      # "Build ve Deploy" de uretiyor ama repoya COMMIT ATAMIYOR (izni
      # contents: read). Burada uretip islemezsek dosya git'te bayatlar ve
      # tazelik kontrolu iki gunde YANLIS ALARM verir.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ana Sayfa Seritleri
        run: node scripts/anasayfa-uret.mjs
      - name: Ana Sayfa Seritlerini Isle
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/anasayfa.json
          if git diff --cached --quiet; then
            echo "anasayfa.json degismedi"
          else
            git commit -m "Ana sayfa seritleri guncellendi"
            git pull --rebase origin main
            git push
          fi

      # Bilerek EN SONA konuldu: bayat bir dosya bulunsa bile taze kategorilerin
      # DB'ye akmasi engellenmesin, ama is yine de kirmizi olsun (hata maili).
      # continue-on-error YOK - amaci tam olarak isi kirmizi yapmak.
      - name: Veri Tazelik Kontrolu
        run: python scripts/veri_tazelik_kontrol.py
