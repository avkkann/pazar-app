name: Veri Guncelle
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v3
        with:
          # Veri Tazelik Kontrolu adimi dosya basina 'git log' okuyor; shallow
          # clone'da HEAD'de degismeyen dosyalarin gecmisi gorunmez.
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
        env:
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
      - run: python hal_scraper.py
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Veri guncellendi" || exit 0
          git pull --rebase origin main
          git push
      - name: DB Senkronizasyonu
        run: python sync_db.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Sahte Indirim Analizi
        continue-on-error: true
        run: python indirim_analiz.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # NOT: "Fiyat Alarmi Taramasi" bu job'dan CIKARILDI, ayri 'fiyat-alarm'
      # job'una tasindi (needs: update). Gerekce: bu bir YAN IS (push bildirimi),
      # yayin yolunu (veri commit + ana sayfa + tazelik) bloke ETMEMELI; ama
      # ayri job HARD-FAIL kaldigi icin sessizce de yutulmaz (cokerse workflow
      # kirmizi -> bildirim). needs: update, veri commit+push tamamlandiktan
      # SONRA kosmayi garanti eder.

      # Ana sayfanin dort seridi. "Sahte Indirim Analizi"nden SONRA kosmali:
      # supheli serit indirim_supheli_* kolonlarini okuyor.
      # "Build ve Deploy" de uretiyor ama repoya COMMIT ATAMIYOR (izni
      # contents: read). Burada uretip islemezsek dosya git'te bayatlar ve
      # tazelik kontrolu iki gunde YANLIS ALARM verir.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ana Sayfa Seritleri
        run: node scripts/anasayfa-uret.mjs
      - name: Ana Sayfa Seritlerini Isle
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/anasayfa.json data/indirim_analiz_son.json
          if git diff --cached --quiet; then
            echo "anasayfa.json degismedi"
          else
            git commit -m "Ana sayfa seritleri guncellendi"
            git pull --rebase origin main
            git push
          fi

      # Bilerek EN SONA konuldu: bayat bir dosya bulunsa bile taze kategorilerin
      # DB'ye akmasi engellenmesin, ama is yine de kirmizi olsun (hata maili).
      # continue-on-error YOK - amaci tam olarak isi kirmizi yapmak.
      - name: Veri Tazelik Kontrolu
        run: python scripts/veri_tazelik_kontrol.py

  # Yan is: fiyat alarmi taramasi. AYRI job -> yayin yolunu (update) bloke
  # etmez; HARD-FAIL kaldigindan cokerse workflow kirmizi olur (sessiz yutma
  # yok). needs: update -> update'in TUM adimlari (veri commit+push dahil)
  # basariyla bittikten SONRA kosar; boylece fonksiyonun raw.githubusercontent'ten
  # cektigi data guncel olur. Checkout GEREKMEZ: yalnizca Edge Function'a curl
  # atiyor, repo dosyasi okumuyor.
  fiyat-alarm:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Fiyat Alarmi Taramasi
        # TESHIS EDILEBILIR hard-fail: -f (statuyu/govdeyi yutar) YERINE durum
        # kodunu YAKALA, kodu+govdeyi logla, 200 degilse exit 1. Boylece cokerse
        # HANGI kod oldugu koomu loglarinda gorunur (sessiz yutma yok). -v veya
        # istek basliklari BASILMAZ (secret sizmasin); govde bizim fonksiyondan.
        run: |
          KOD=$(curl -s -o /tmp/yanit.txt -w "%{http_code}" -X POST \
            "https://gbgxxahhbfnulmyecxia.supabase.co/functions/v1/fiyat-alarm-scan" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP=$KOD"
          echo "yanit: $(cat /tmp/yanit.txt)"
          if [ "$KOD" != "200" ]; then
            echo "::error::fiyat-alarm-scan HTTP $KOD dondu (200 bekleniyordu)"
            exit 1
          fi
