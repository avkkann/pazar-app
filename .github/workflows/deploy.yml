name: Build ve Deploy
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Veri Guncelle"]
    types: [completed]
  workflow_dispatch:

# Cloudflare Workers'a deploy ediliyor, GitHub Pages'e DEGIL.
# pages: write ve id-token: write kaldirildi — ikisi de Pages'e ozguydu.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ─── TEST KAPISI ───────────────────────────────────────────────────────
  # Ayri job; deploy 'needs: test' ile buna bagli -> KIRMIZI test yayini durdurur.
  # continue-on-error YOK (bilerek): bu depoda en sik hata sessiz basarisizlik;
  # test hatti sessiz kalirsa hic yokmus gibi olur. Ciktilari ::group:: ile
  # ayrildi ve her kirmizi ::error file=... ile isaretlendi -> hangi dosya/iddia
  # bir bakista gorunur. Node ve Python AYRI ADIM -> hangisinin kirdigi belli.
  # npm ci YOK: test_*.mjs yalniz Node builtin + yerel scripts/*.mjs okuyor,
  # test_*.py yalniz stdlib -> agsiz/paketsiz.
  # UYARI (bilincli tercih): deploy workflow_run("Veri Guncelle") ile de tetikleniyor;
  # veriye bagli bir test gecelik veri yuzunden kirmizi olursa site eski veriyle
  # DONAR. Bu kapinin amaci tam olarak bozuk seyi yayinlamamak. Mustafa haberdar
  # olur: ci_activity bildirimleri hesabina ulasiyor (2026-08-21 olcumu: inbox'ta
  # 16 ci_activity kaydi).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python bagimliliklari
        # test_depot/hal/liste_fiyat scraper modullerini import ediyor
        # (hal_scraper vb.), o moduller modul seviyesinde 'requests' cekiyor ->
        # yoksa ModuleNotFoundError. update-data.yml ile ayni bagimliliklar.
        run: pip install requests beautifulsoup4
      - name: JS testleri (test_*.mjs)
        run: |
          fail=0
          for t in test_*.mjs; do
            echo "::group::$t"
            if node "$t"; then
              echo "  -> gecti"
            else
              echo "::error file=$t::$t KIRMIZI — yukaridaki 'FAIL' satirlarina bak (hangi iddia, beklenen/gercek deger)"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then echo "::error::JS testlerinden en az biri KIRMIZI -> deploy engellendi"; exit 1; fi
      - name: Python testleri (test_*.py, standalone)
        run: |
          # test_resim.py BILEREK DISLANDI: gercek test ama canli api.searlo.tech'e
          # istek atiyor (Searlo kredisi tukendi) -> CI'da her deploy'u kirardi.
          # Searlo SONDALARI (sonda_*.py) gitignore'lu -> CI checkout'unda zaten yok.
          fail=0
          for t in test_*.py; do
            if [ "$t" = "test_resim.py" ]; then echo "  $t ATLANDI (canli Searlo API — CI'da kredi/limit)"; continue; fi
            echo "::group::$t"
            if python "$t"; then
              echo "  -> gecti"
            else
              echo "::error file=$t::$t KIRMIZI — yukaridaki cikti hangi iddianin dustugunu gosterir"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then echo "::error::Python testlerinden en az biri KIRMIZI -> deploy engellendi"; exit 1; fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # "Veri Guncelle" basarisiz bittiyse deploy etme. Diger tetikleyicilerde
    # (push, workflow_dispatch) kosul yok. Bu kapi Pages'e ozgu DEGILDI, aynen duruyor.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          # 20 -> 24. wrangler 4.x "node >= 22" istiyor; Node 20'de deploy adimi
          # "Wrangler requires at least Node.js v22.0.0" diyip dusuyordu (kosu
          # 32044309234). Bu satir Pages is akisindan aynen tasinmisti — Pages
          # icin dogruydu, wrangler devreye girince yanlis oldu.
          # 22 degil 24: yerel gelistirme ortami v24.18.0 ve hata TAM OLARAK
          # yerel-CI majör farkindan cikti; ikisi ayni majörde olsun.
          # (Runner'in kendi varsayilani da 24; Node 20 kullanimdan kaldiriliyor.)
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          # Hub tazelik kontrolu (asagida) bir Python betigi; bugune kadar bu
          # is akisinda yalnizca Node vardi. python-version verilmiyor: runner
          # varsayilanindan hoslaniyoruz, veri_tazelik_kontrol.py'nin gordugu
          # tek surum bagimliligi standart kutuphane (json/re/datetime).
          python-version: '3.x'
      - run: npm ci
      - run: npm run build
        env:
          # vite.config.js'in VARSAYILANI zaten base:'/' — bu satir zorunlu degil.
          # Niyeti acik tutmak ve varsayilan ileride degisirse koruma saglamak icin
          # duruyor. Eski Pages duzeni icin deger 'ghpages' olurdu.
          DEPLOY_TARGET: cloudflare
      - name: Hub Sayfalari Tazelik Kontrolu
        # Wrangler'dan ONCE, bilerek: dusen bir kontrol yayini hic yaptirmamali.
        # continue-on-error YOK -- amaci tam olarak isi kirmizi yapmak ve
        # deploy'u engellemek. Sessizce bayat sayfa yayinlamak bu projenin
        # dort kez yedigi tuzak (bkz. veri_tazelik_kontrol.py dosya basi notu).
        #
        # Sayfalar dist/'ten okunur (--hub dist): kapinin butun anlami YAYINA
        # GIDEN seyin denetlenmesi. .hub/'i denetlemek sadece ARA URUNU
        # dogrulardi -- prepare-public.mjs'in kopyalama adimi bir sayfayi
        # duserse, yarim kopyalarsa ya da bozarsa kapi yesil kalirdi ve bozuk
        # dist/ yayina giderdi; bu tam olarak bu kapinin engellemesi gereken
        # ariza sinifi.
        #
        # Kayit .hub/manifest.json'dan okunur (--manifest .hub/manifest.json):
        # dist/manifest.json BASKA BIR SEY -- uygulamanin PWA manifest'i (bir
        # nesne, hub manifest'i gibi bir liste DEGIL). hub-uret.mjs'in urettigi
        # hub manifest'i (kok dizininde, sayfa basina durum/tip/damga kaydi)
        # BILEREK dist/'e kopyalanmiyor (bkz. prepare-public.mjs) cunku isim
        # cakisirdi. --manifest bu isim cakismasini kayit (nereden okunur) ile
        # denetlenen dizini (sayfalar nereden okunur) ayirarak cozuyor;
        # manifestteki 'yol' alanlari yine <hub_dir><yol>index.html olarak,
        # yani --hub ile verilen dist/'e gore cozuluyor. Runner'da 'py' yok
        # (Windows'a ozgu), 'python' kullaniliyor.
        run: python scripts/veri_tazelik_kontrol.py --hub dist --manifest .hub/manifest.json
      - name: Cloudflare Workers Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # SURUM SABIT. wrangler neredeyse her gun yayin yapiyor (npm: 4.113.0
          # 21 Tem -> 4.123.0 13 Agu, 12 kararli surum); sabitlemezsek deploy
          # davranisi biz hicbir sey degistirmeden gunden gune kayar.
          # 4.122.0 secildi: latest'in (4.123.0) bir minor gerisi, 12 Agustos'ta
          # yayinlandi ve ARDINDAN HOTFIX GELMEDI (4.123.0 bir sonraki minor,
          # 4.122.x yamasi degil). Karsilastirma: 4.120.0 ertesi gun 4.120.1
          # ile yamandi — o tur '.0'lardan kacinildi. Sabit, dondurma degil;
          # periyodik gozden gecirilecek.
          wranglerVersion: '4.122.0'
          # wrangler.jsonc: main src/worker.js, assets ./dist, CSP header Worker'dan
